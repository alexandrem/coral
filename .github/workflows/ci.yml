name: CI

on:
  push:
    branches: ["main"]   # post-merge CI only
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  # A newer commit supersedes validation of the same branch or pull request.
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write    # for coverage comments, CodeQL
  checks: write           # for test results
  packages: write         # push container images to ghcr.io

env:
  GOPROXY: https://proxy.golang.org,direct
  GOSUMDB: sum.golang.org
  GO_VERSION: "1.25.1"

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run-ci: ${{ steps.classify.outputs.run-ci }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the full pull request diff
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          # Always validate main: a docs push may supersede an untested code push.
          run_ci = True
          base, head = os.environ["BASE_SHA"], os.environ["HEAD_SHA"]
          if os.environ["EVENT_NAME"] == "pull_request" and all(
              re.fullmatch(r"[0-9a-f]{40}", sha) for sha in (base, head)
          ):
              try:
                  changed = subprocess.check_output([
                      "git", "diff", "--name-only", "--no-renames", "-z",
                      f"{base}...{head}", "--",
                  ]).split(b"\0")
                  paths = [os.fsdecode(path) for path in changed if path]
                  root_docs = {"README.md", "LICENSE", "CLAUDE.md", "CONTRIBUTING.md",
                               "CODE_OF_CONDUCT.md", "SECURITY.md"}
                  def documentation(path):
                      return path in root_docs or (
                          path.startswith(("docs/", "RFDs/", ".github/ISSUE_TEMPLATE/"))
                          and path.endswith(".md")
                      )
                  # Unknown paths, empty diffs, and failed comparisons run full CI.
                  # Markdown elsewhere can be embedded in the application.
                  run_ci = not paths or not all(documentation(path) for path in paths)
              except subprocess.CalledProcessError:
                  print("Could not classify the diff; running full CI.")

          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write(f"run-ci={str(run_ci).lower()}\n")
          print("Running full CI." if run_ci else "Only documentation changed; skipping heavy checks.")
          PY

  # ──────────────────────────────────────────────────────────────
  # Shared modules and tools; compilation caches are saved by test and e2e.
  # ──────────────────────────────────────────────────────────────
  go-env:
    name: Cache Go modules & tools
    needs: changes
    if: needs.changes.outputs.run-ci == 'true'
    runs-on: ubuntu-latest
    outputs:
      mod-cache-key: ${{ steps.mod.outputs.cache-key }}
      build-cache-prefix: ${{ steps.mod.outputs.build-cache-prefix }}
      tools-cache-key: ${{ steps.tools.outputs.cache-key }}
      generated-cache-key: ${{ steps.generated.outputs.cache-key }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install APT packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y $(cat .github/apt-packages.txt || echo "")

      - name: Go cache keys
        id: mod
        run: |
          echo "cache-key=go-mod-v6-${{ runner.os }}-${{ runner.arch }}-go${{ env.GO_VERSION }}-${{ hashFiles('**/go.mod', '**/go.sum') }}" >> "$GITHUB_OUTPUT"
          echo "build-cache-prefix=go-build-v1-${{ runner.os }}-${{ runner.arch }}-go${{ env.GO_VERSION }}-${{ hashFiles('**/go.mod', '**/go.sum') }}" >> "$GITHUB_OUTPUT"

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ steps.mod.outputs.cache-key }}
          restore-keys: |
            go-mod-v6-${{ runner.os }}-${{ runner.arch }}-go${{ env.GO_VERSION }}-

      - name: Restore Go build cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/go-build
          key: ${{ steps.mod.outputs.build-cache-prefix }}-${{ github.sha }}-${{ github.job }}
          restore-keys: |
            ${{ steps.mod.outputs.build-cache-prefix }}-${{ github.sha }}-
            ${{ steps.mod.outputs.build-cache-prefix }}-

      - name: Go tools cache key
        id: tools
        run: |
          echo "cache-key=go-tools-v5-${{ runner.os }}-${{ runner.arch }}-go${{ env.GO_VERSION }}-${{ hashFiles('Makefile') }}" >> "$GITHUB_OUTPUT"

      - name: Cache Go tools
        id: cache-tools
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: ${{ steps.tools.outputs.cache-key }}

      # Cache only exact generator inputs; stale embedded binaries are unsafe.
      - name: Generated files cache key
        id: generated
        shell: bash
        env:
          GENERATOR_HASH: >-
            ${{ hashFiles('proto/**/*.proto', 'buf.yaml', 'buf.gen.yaml', 'buf.lock',
                'Makefile', 'go.mod', 'go.sum', '.github/apt-packages.txt',
                'scripts/download-deno.sh', 'scripts/download-beyla.sh',
                'internal/**/generate.go', 'internal/agent/debug/uprobe.go',
                'internal/agent/debug/cpu_profiler.go',
                'internal/agent/**/*.c', 'internal/agent/**/*.h') }}
        run: |
          clang_version=$(clang --version)
          llvm_version=$(llvm-strip --version)
          toolchain_hash=$(printf '%s\n%s\n' "$clang_version" "$llvm_version" | sha256sum | cut -d ' ' -f 1)
          echo "cache-key=generated-v4-${{ runner.os }}-${{ runner.arch }}-go${{ env.GO_VERSION }}-${toolchain_hash}-${GENERATOR_HASH}" >> "$GITHUB_OUTPUT"

      - name: Cache generated files
        id: cache-generated
        uses: actions/cache@v4
        with:
          path: |
            internal/cli/run/binaries
            internal/agent/beyla/binaries
            internal/agent/ebpf/bpfgen/*_bpf*.go
            internal/agent/ebpf/bpfgen/*_bpf*.o
            internal/agent/debug/*_bpf*.go
            internal/agent/debug/*_bpf*.o
            coral/**/*.pb.go
            coral/**/*.connect.go
          key: ${{ steps.generated.outputs.cache-key }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Install Go tools
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: make install-tools || make install-tools  # retry once if needed

      - name: Download modules
        run: |
          go mod download
          (cd tests/integration && go mod download)
          (cd tests/e2e/distributed && go mod download)

      - name: Generate files (if not cached)
        if: steps.cache-generated.outputs.cache-hit != 'true'
        run: make generate
        timeout-minutes: 10

  # ──────────────────────────────────────────────────────────────
  # Tests + Coverage
  # ──────────────────────────────────────────────────────────────
  test:
    needs: go-env
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install APT packages
        run: |
          sudo apt-get update
          sudo apt-get install -y $(cat .github/apt-packages.txt || echo "")

      - uses: actions/cache/restore@v4
        with:
          key: ${{ needs.go-env.outputs.mod-cache-key }}
          path: ~/go/pkg/mod

      - uses: actions/cache/restore@v4
        with:
          key: ${{ needs.go-env.outputs.tools-cache-key }}
          path: ~/go/bin

      - uses: actions/cache/restore@v4
        with:
          key: ${{ needs.go-env.outputs.generated-cache-key }}
          path: |
            internal/cli/run/binaries
            internal/agent/beyla/binaries
            internal/agent/ebpf/bpfgen/*_bpf*.go
            internal/agent/ebpf/bpfgen/*_bpf*.o
            internal/agent/debug/*_bpf*.go
            internal/agent/debug/*_bpf*.o
            coral/**/*.pb.go
            coral/**/*.connect.go
          fail-on-cache-miss: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      # Cache entries are immutable: refresh compiled packages for each commit.
      # Prefer this commit's cache, then the most recent compatible commit.
      - name: Cache Go build outputs
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: ${{ needs.go-env.outputs.build-cache-prefix }}-${{ github.sha }}-${{ github.job }}
          restore-keys: |
            ${{ needs.go-env.outputs.build-cache-prefix }}-${{ github.sha }}-
            ${{ needs.go-env.outputs.build-cache-prefix }}-

      - name: Add tools to PATH
        run: echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Run tests with coverage
        run: make test-ci
        timeout-minutes: 30

      - name: Generate coverage report
        run: go tool cover -func=coverage.out -o coverage.txt

      - name: Check coverage threshold
        run: |
          coverage=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${coverage}%"
          # Set a minimum threshold (start with current coverage and gradually increase)
          threshold=15.0
          if (( $(echo "$coverage < $threshold" | bc -l) )); then
            echo "❌ Coverage ${coverage}% is below ${threshold}% threshold"
            exit 1
          else
            echo "✅ Coverage ${coverage}% meets ${threshold}% threshold"
          fi

      - name: Upload coverage to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.out
            coverage.txt
          retention-days: 30

  # ──────────────────────────────────────────────────────────────
  # Integration Tests (Docker-based)
  # ──────────────────────────────────────────────────────────────
  integration-tests:
    needs: go-env
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install APT packages
        run: |
          sudo apt-get update
          sudo apt-get install -y $(cat .github/apt-packages.txt || echo "")

      - uses: actions/cache/restore@v4
        with:
          key: ${{ needs.go-env.outputs.mod-cache-key }}
          path: ~/go/pkg/mod

      - uses: actions/cache/restore@v4
        with:
          key: ${{ needs.go-env.outputs.tools-cache-key }}
          path: ~/go/bin

      - uses: actions/cache/restore@v4
        with:
          key: ${{ needs.go-env.outputs.generated-cache-key }}
          path: |
            internal/cli/run/binaries
            internal/agent/beyla/binaries
            internal/agent/ebpf/bpfgen/*_bpf*.go
            internal/agent/ebpf/bpfgen/*_bpf*.o
            internal/agent/debug/*_bpf*.go
            internal/agent/debug/*_bpf*.o
            coral/**/*.pb.go
            coral/**/*.connect.go
          fail-on-cache-miss: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Restore Go build cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/go-build
          key: ${{ needs.go-env.outputs.build-cache-prefix }}-${{ github.sha }}-${{ github.job }}
          restore-keys: |
            ${{ needs.go-env.outputs.build-cache-prefix }}-${{ github.sha }}-
            ${{ needs.go-env.outputs.build-cache-prefix }}-

      - name: Add tools to PATH
        run: echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Run integration tests
        run: make test-integration

  # ──────────────────────────────────────────────────────────────
  # Static Analysis
  # ──────────────────────────────────────────────────────────────
  static-analysis:
    needs: go-env
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install APT packages
        run: |
          sudo apt-get update
          sudo apt-get install -y $(cat .github/apt-packages.txt || echo "")

      - uses: actions/cache/restore@v4
        with:
          key: ${{ needs.go-env.outputs.mod-cache-key }}
          path: ~/go/pkg/mod

      - uses: actions/cache/restore@v4
        with:
          key: ${{ needs.go-env.outputs.tools-cache-key }}
          path: ~/go/bin

      - uses: actions/cache/restore@v4
        with:
          key: ${{ needs.go-env.outputs.generated-cache-key }}
          path: |
            internal/cli/run/binaries
            internal/agent/beyla/binaries
            internal/agent/ebpf/bpfgen/*_bpf*.go
            internal/agent/ebpf/bpfgen/*_bpf*.o
            internal/agent/debug/*_bpf*.go
            internal/agent/debug/*_bpf*.o
            coral/**/*.pb.go
            coral/**/*.connect.go
          fail-on-cache-miss: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Restore Go build cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/go-build
          key: ${{ needs.go-env.outputs.build-cache-prefix }}-${{ github.sha }}-${{ github.job }}
          restore-keys: |
            ${{ needs.go-env.outputs.build-cache-prefix }}-${{ github.sha }}-
            ${{ needs.go-env.outputs.build-cache-prefix }}-

      - name: Add tools to PATH
        run: echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Check go generate
        run: |
          make generate
          git diff --exit-code || (echo "go generate changed files — commit them!" && exit 1)

      - name: Lint
        run: make lint

      - name: Vet
        run: make vet

      - name: Format check
        run: |
          if [ -n "$(goimports -l .)" ]; then
            echo "Files need formatting: run 'goimports -w .'"
            exit 1
          fi

  # ──────────────────────────────────────────────────────────────
  # E2E: Build binaries and images once, then test on the same runner.
  # ──────────────────────────────────────────────────────────────
  e2e:
    name: Build E2E test apps & run tests
    needs: [go-env, test, static-analysis, integration-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install APT packages
        run: |
          sudo apt-get update
          sudo apt-get install -y $(cat .github/apt-packages.txt || echo "")

      - uses: actions/cache/restore@v4
        with:
          key: ${{ needs.go-env.outputs.mod-cache-key }}
          path: ~/go/pkg/mod

      - uses: actions/cache/restore@v4
        with:
          key: ${{ needs.go-env.outputs.tools-cache-key }}
          path: ~/go/bin

      - uses: actions/cache/restore@v4
        with:
          key: ${{ needs.go-env.outputs.generated-cache-key }}
          path: |
            internal/cli/run/binaries
            internal/agent/beyla/binaries
            internal/agent/ebpf/bpfgen/*_bpf*.go
            internal/agent/ebpf/bpfgen/*_bpf*.o
            internal/agent/debug/*_bpf*.go
            internal/agent/debug/*_bpf*.o
            coral/**/*.pb.go
            coral/**/*.connect.go
          fail-on-cache-miss: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Cache Go build outputs
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: ${{ needs.go-env.outputs.build-cache-prefix }}-${{ github.sha }}-${{ github.job }}
          restore-keys: |
            ${{ needs.go-env.outputs.build-cache-prefix }}-${{ github.sha }}-
            ${{ needs.go-env.outputs.build-cache-prefix }}-

      - name: Add tools to PATH
        run: echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Build all binaries
        run: make build-all

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-amd64-binaries
          path: bin/
          retention-days: 30
          if-no-files-found: error

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Colony image metadata
        id: meta-colony
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/coral-colony
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=main,enable=${{ github.event_name == 'push' }}

      - name: Agent image metadata
        id: meta-agent
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/coral-agent
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=main,enable=${{ github.event_name == 'push' }}

      - name: Build and load coral-colony
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Dockerfile.colony
          load: true
          tags: |
            coral-colony:e2e
            ${{ steps.meta-colony.outputs.tags }}
          labels: ${{ steps.meta-colony.outputs.labels }}
          cache-from: type=gha,scope=colony
          cache-to: type=gha,scope=colony,mode=max
        timeout-minutes: 15

      - name: Build and load coral-agent
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Dockerfile.agent
          load: true
          tags: |
            coral-agent:e2e
            ${{ steps.meta-agent.outputs.tags }}
          labels: ${{ steps.meta-agent.outputs.labels }}
          cache-from: type=gha,scope=agent
          cache-to: type=gha,scope=agent,mode=max
        timeout-minutes: 15

      - name: Add coral binary to PATH
        run: |
          chmod +x bin/linux_amd64/coral
          echo "${{ github.workspace }}/bin/linux_amd64" >> $GITHUB_PATH

      - name: Build E2E test apps
        run: cd tests/e2e/distributed && make build-apps
        timeout-minutes: 15
        env:
          DOCKER_BUILDKIT: 1

      - name: Start E2E services
        run: cd tests/e2e/distributed && make local-up COMPOSE_UP_FLAGS=--no-build

      - name: Run E2E tests
        run: cd tests/e2e/distributed && make test
        timeout-minutes: 30

      - name: Log in to ghcr.io
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Publish the images that passed E2E without rebuilding them.
      - name: Push tested production images
        if: github.event_name == 'push'
        env:
          COLONY_TAGS: ${{ steps.meta-colony.outputs.tags }}
          AGENT_TAGS: ${{ steps.meta-agent.outputs.tags }}
        run: |
          printf '%s\n%s\n' "$COLONY_TAGS" "$AGENT_TAGS" | while IFS= read -r image; do
            docker push "$image"
          done
        timeout-minutes: 10

      - name: Collect logs on failure
        if: failure()
        run: |
          cd tests/e2e/distributed
          docker compose --project-directory ../../.. -f ../../../docker-compose.yml -f docker-compose.e2e.yml logs --tail=500 --no-log-prefix > /tmp/e2e-logs.txt 2>&1 || true
        timeout-minutes: 2

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-logs
          path: /tmp/e2e-logs.txt
          retention-days: 7
          if-no-files-found: ignore

      - name: Cleanup Docker resources
        if: always()
        run: make test-e2e-down || true

  # ──────────────────────────────────────────────────────────────
  # Build
  # ──────────────────────────────────────────────────────────────
  build:
    needs: [go-env, e2e]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact-os: linux
            artifact-arch: amd64
          - os: macos-15  # Intel Mac for amd64
            artifact-os: darwin
            artifact-arch: amd64
          - os: macos-latest  # Apple Silicon for arm64
            artifact-os: darwin
            artifact-arch: arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install APT packages (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y $(cat .github/apt-packages.txt || echo "")

      - name: Install Homebrew packages (macOS only)
        if: runner.os == 'macOS'
        run: |
          brew install llvm

      - uses: actions/cache/restore@v4
        if: runner.os == 'Linux'
        with:
          key: ${{ needs.go-env.outputs.mod-cache-key }}
          path: ~/go/pkg/mod

      - uses: actions/cache/restore@v4
        if: runner.os == 'Linux'
        with:
          key: ${{ needs.go-env.outputs.tools-cache-key }}
          path: ~/go/bin

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Cache macOS Go modules
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: go-mod-v6-${{ runner.os }}-${{ runner.arch }}-go${{ env.GO_VERSION }}-${{ hashFiles('**/go.mod', '**/go.sum') }}
          restore-keys: |
            go-mod-v6-${{ runner.os }}-${{ runner.arch }}-go${{ env.GO_VERSION }}-

      - name: Cache macOS Go build outputs
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/go-build
          key: go-build-v1-${{ runner.os }}-${{ runner.arch }}-go${{ env.GO_VERSION }}-${{ hashFiles('**/go.mod', '**/go.sum') }}-${{ matrix.artifact-arch }}-${{ github.sha }}
          restore-keys: |
            go-build-v1-${{ runner.os }}-${{ runner.arch }}-go${{ env.GO_VERSION }}-${{ hashFiles('**/go.mod', '**/go.sum') }}-${{ matrix.artifact-arch }}-

      - name: Cache macOS Go tools
        if: runner.os == 'macOS'
        id: cache-tools
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: go-tools-v5-${{ runner.os }}-${{ runner.arch }}-go${{ env.GO_VERSION }}-${{ hashFiles('Makefile') }}

      - name: Install Go tools
        if: runner.os != 'Linux' && steps.cache-tools.outputs.cache-hit != 'true'
        run: make install-tools || make install-tools  # retry once if needed

      - name: Download modules
        if: runner.os != 'Linux'
        run: go mod download

      - name: Add tools to PATH
        run: echo "$HOME/go/bin" >> $GITHUB_PATH

      # Reuse Linux binary from e2e job, build for other platforms
      - name: Download Linux binary from e2e
        if: runner.os == 'Linux'
        uses: actions/download-artifact@v4
        with:
          name: linux-amd64-binaries
          path: bin/

      - name: Build
        if: runner.os != 'Linux'
        run: make build

      # Linux binaries were already uploaded by e2e; only upload for macOS.
      - name: Upload binaries
        if: runner.os != 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-os }}-${{ matrix.artifact-arch }}-binaries
          path: bin/
          retention-days: 30
          if-no-files-found: error

  # ------------------------------------------------------------
  # Security scanning
  # ------------------------------------------------------------
  security:
    needs: changes
    if: needs.changes.outputs.run-ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Recommended: Consider using CodeQL for better integration with GitHub Security features.
      - name: Run Gosec
        uses: securego/gosec@master
        with:
          args: "-no-fail -exclude-dir=tests -fmt sarif -out results.sarif ./..."
        continue-on-error: true

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
        continue-on-error: true

  # ------------------------------------------------------------
  # Dependency checks
  # ------------------------------------------------------------
  dependencies:
    needs: changes
    if: needs.changes.outputs.run-ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # NOTE: No Go tool cache restore is needed here since 'go mod' commands don't rely on ~/go/bin.

      - name: Verify dependencies
        run: |
          # This command ensures all downloaded modules are present and match go.sum
          go mod verify

          # We don't run 'go mod tidy' to avoid modifying the repository state,
          # but we check if it *would* change anything.
          go mod tidy
          git diff --exit-code go.mod go.sum || (echo "go.mod or go.sum need tidying"; exit 1)

  # Require this check in branch protection; it also runs for docs-only PRs.
  ci-result:
    name: CI result
    if: always()
    needs: [changes, go-env, test, integration-tests, static-analysis, e2e, build, security, dependencies]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all expected checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os

          results = json.loads(os.environ["RESULTS"])
          changes = results.pop("changes")
          run_ci = changes["outputs"].get("run-ci")
          if changes["result"] != "success" or run_ci not in {"true", "false"}:
              raise SystemExit("Change classification did not succeed.")
          expected = "success" if run_ci == "true" else "skipped"
          unexpected = {name: job["result"] for name, job in results.items()
                        if job["result"] != expected}
          if unexpected:
              raise SystemExit(f"Expected {expected} checks, got: {unexpected}")
          print("All required checks passed." if run_ci == "true"
                else "Documentation-only PR; heavy checks were intentionally skipped.")
          PY
