name: Manual E2E

on:
  workflow_dispatch:

concurrency:
  group: e2e-manual-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  GOPROXY: https://proxy.golang.org,direct
  GOSUMDB: sum.golang.org
  GO_VERSION: "1.25.1"

jobs:
  e2e:
    name: Build E2E environment & run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install APT packages
        run: |
          sudo apt-get update
          sudo apt-get install -y $(cat .github/apt-packages.txt || echo "")

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install Go tools
        run: make install-tools || make install-tools

      - name: Add tools to PATH
        run: echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Download modules
        run: go mod download

      - name: Generate files
        run: make generate
        timeout-minutes: 10

      - name: Build coral binary
        run: make build-all

      - name: Add coral binary to PATH
        run: |
          chmod +x bin/linux_amd64/coral
          echo "${{ github.workspace }}/bin/linux_amd64" >> $GITHUB_PATH

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production images
        run: docker compose build colony agent-0 agent-1
        timeout-minutes: 15
        env:
          DOCKER_BUILDKIT: 1

      - name: Build E2E test apps
        run: cd tests/e2e/distributed && make build
        timeout-minutes: 15
        env:
          DOCKER_BUILDKIT: 1

      - name: Start E2E services
        run: cd tests/e2e/distributed && make local-up

      - name: Run E2E tests
        run: cd tests/e2e/distributed && make test
        timeout-minutes: 30

      - name: Collect logs on failure
        if: failure()
        run: |
          cd tests/e2e/distributed
          docker compose --project-directory ../../.. -f ../../../docker-compose.yml -f docker-compose.e2e.yml logs --tail=500 --no-log-prefix > /tmp/e2e-logs.txt 2>&1 || true
        timeout-minutes: 2

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: manual-e2e-failure-logs
          path: /tmp/e2e-logs.txt
          retention-days: 7
          if-no-files-found: ignore

      - name: Cleanup Docker resources
        if: always()
        run: make test-e2e-down || true
